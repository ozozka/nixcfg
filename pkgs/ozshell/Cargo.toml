[package]
name = "ozshell"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
libc = "0.2"
png = "0.18"
pollster = "0.4"
raw-window-handle = "0.6"
resvg = { version = "0.49", default-features = false }
serde = "1"
serde_json = "1"
smithay-client-toolkit = "0.21"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "process", "sync", "macros"] }
wayland-client = { version = "0.31", features = ["system"] }
wgpu = { version = "30", default-features = false, features = ["std", "vulkan", "wgsl"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }
zune-jpeg = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
